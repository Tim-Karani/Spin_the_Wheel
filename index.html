<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">
    <title>Spin the Wheel | County Kibao</title>
    <link rel="icon" type="image/png" href="assets/images/logo/kk.png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">
</head>
<body>

    <div id="loading-screen" aria-live="polite">
        <div class="loader"></div>
        <p>Preparing the Kibao wheel...</p>
    </div>

    <main class="app" aria-label="County Kibao Spin the Wheel game">

        <section class="wheel-stage">

            <!-- Fixed result pointer. The supplied artwork remains untouched. -->
            <div class="pointer" aria-hidden="true"></div>

            <div class="wheel-wrapper">
                <canvas id="wheelCanvas" aria-label="Spin the wheel"></canvas>
            </div>

            <button id="spinBtn" type="button" aria-label="Spin the wheel">
                SPIN
            </button>

            <p class="spin-hint">Tap the wheel to spin</p>

        </section>

    </main>

    <div class="popup-overlay hidden" id="winnerPopup">
        <div class="popup-card" role="dialog" aria-modal="true" aria-labelledby="popupTitle">
            <div class="popup-icon" id="popupIcon">🎉</div>
            <h2 id="popupTitle">Congratulations!</h2>
            <p id="popupSubtitle">You have won</p>
            <h1 id="winnerName">Bucket Hat</h1>
            <p class="popup-message" id="popupMessage">
                Please visit the Kibao activation desk to collect your prize.
            </p>
            <div class="popup-buttons">
                <button id="closePopup" type="button">COLLECT PRIZE</button>
            </div>
        </div>
    </div>

    <script src="js/storage.js"></script>
    <script src="js/prizes.js"></script>
    <script src="js/wheel.js"></script>
    <script src="js/popup.js"></script>
    <script src="js/sounds.js"></script>
    <script src="js/analytics.js"></script>
    <script src="js/app.js"></script>

</body>
</html>
